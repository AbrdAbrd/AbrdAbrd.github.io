const slides = [
 {title:'Survival',section:'Introduction',time:'30 seconds',type:'cover',ayman:'Hello, we’re Ayman and Milo. Our question today is: what does it take to survive on the island, and what might survival cost? We’ll distinguish staying alive from keeping your humanity.',milo:'You’ll need a pen and your exercise book. Be ready to discuss priorities, analyse five quotations and test your understanding.'},
 {title:'What would you save first?',section:'Do now',time:'2 minutes',type:'donow',ayman:'Imagine you are stranded on the island. Choose three priorities and explain your first choice. Work independently for one minute before discussing with your partner.',milo:'Take two answers. There is no single survival ranking to memorise. The point is that different priorities can cause conflict, just as they do for Ralph and Jack.'},
 {title:'Two kinds of survival',section:'The big idea',time:'1 minute',type:'idea',ayman:'Physical survival means staying alive: food, shelter and protection. Moral survival means preserving empathy, responsibility and self-control.',milo:'Hunting can provide food, but it becomes a source of power and violence. Ask: does becoming a better hunter make the whole island safer?'},
 {title:'Why Golding wrote it',section:'Context & intention',time:'1 minute',type:'context',ayman:'Golding served in the Royal Navy during the Second World War and took part in the Normandy landings. His experience challenged his faith in human goodness.',milo:'The Coral Island offers an optimistic picture of British boys on an island. Golding challenges that confidence. The officer’s warship suggests that the adult world shares the boys’ capacity for violence.'},
 {title:'Five quotes. One question.',section:'Class activity',time:'30 seconds',type:'activity',ayman:'For each quotation, decide whether it concerns physical survival, moral survival, or both. Identify one word or method, then explain how it helps Golding explore survival.',milo:'Allow different readings when students support them with evidence. The buttons reveal one possible interpretation, rather than the only correct answer.'},
 ...QUOTES.map((q,i)=>({title:['Rules & responsibility','The signal fire','Hunting & violence','The beast within','The price of rescue'][i],section:`Quote ${i+1} of 5`,time:'45 seconds',type:'quote',quoteIndex:i,ayman:`Ask the class to classify the quotation and explain one word. A possible reading: ${q.note}`,milo:`Read the quotation clearly. Speaker: ${q.who}, ${q.chapter}. Ask students to connect their analysis to survival rather than simply naming a technique.`})),
 {title:'Build an analytical paragraph',section:'Model paragraph',time:'2 minutes',type:'model',ayman:'Read the model, then ask the class to identify its argument, evidence, word analysis and link to the wider novel. They should borrow the structure, not copy it word for word.',milo:'The word “most” establishes a hierarchy. The fire requires shared work, making it both practical and symbolic. Explain what a method does rather than listing terminology.'},
 {title:'What do you remember?',section:'Quick quiz',time:'2 minutes',type:'quiz',ayman:'I’ll lead questions 1, 3 and 5. Ask the class to choose A, B, C or D, then select their answer. Read the explanation before moving on.',milo:'I’ll lead questions 2, 4 and 6. Students can revise an answer. Use the numbered buttons to revisit a question, and explain why an option is right.'},
 {title:'Keep exploring',section:'Further reading',time:'1 minute',type:'reading',ayman:'For revision, reread the moments that show changing survival priorities: the first fire, the missed ship, Simon’s insight and the final hunt.',milo:'The Coral Island provides a useful comparison. Golding’s essay Fable explains his thinking about human nature. Our theme connects especially closely to the Beast, Leadership and Violence groups.'},
 {title:'What does it mean to survive?',section:'Final discussion',time:'1 minute',type:'closing',ayman:'Return to the opening question. If the boys stay alive but lose their humanity, have they successfully survived?',milo:'Leave the class with a balanced conclusion: rescue saves their bodies, but cannot undo the violence, deaths and loss of innocence. Thank the class.'}

// These explanations avoid presenting contextual interpretations as biographical fact.
QUIZ[4].why = 'The glasses make fire possible. Stealing them deprives Ralph’s group of its means of lighting a signal fire and gives Jack control of this resource.';
QUIZ[5].opts[1] = 'They escape the island’s violence, but the officer belongs to an adult world also at war';
QUIZ[5].why = 'The warship makes the rescue ironic: adults end the immediate danger while belonging to a world also capable of organised violence.';
const modelText = `Golding presents survival as dependent on <strong>cooperation and responsibility</strong>. Ralph calls the signal fire the <mark>“most important thing”</mark>, using a superlative to place rescue above competing desires. The fire symbolises hope, but keeping it alight requires shared effort and self-control. When the hunters allow it to go out and a ship passes, Golding reveals the danger of prioritising excitement over collective responsibility. Later, the fire intended to kill Ralph brings rescue instead. This irony suggests that resources alone cannot ensure survival: the boys must also choose to use them for everyone’s benefit.`;

const slideEl=document.getElementById('slide'),strip=document.getElementById('filmstrip');
const footer=()=>`<div class="slide-footer"><span>Lord of the Flies · Survival</span><span>Ayman &amp; Milo &nbsp; / &nbsp; ${String(state.index+1).padStart(2,'0')}</span></div>`;
const eyebrow=s=>`<p class="eyebrow">${esc(s.section)}</p>`;
const heading=s=>`${eyebrow(s)}<h2>${esc(s.title)}</h2>`;
function content(s){
 if(s.type==='cover')return `${eyebrow(s)}<div class="rule"></div><h1>Survival</h1><p class="subtitle">in <em>Lord of the Flies</em></p><p class="byline">Ayman &amp; Milo</p><p class="small" style="color:#d2d9cb">A 15-minute revision lesson</p><img class="book" src="${COVER}" alt="Lord of the Flies book cover from the reference presentation"><p class="book-label">William Golding · 1954</p>`;
 if(s.type==='donow')return `${heading(s)}<p class="subtitle">You’re stranded on an island. Choose your <strong>three priorities</strong>.</p><div class="actions">${NEEDS.map(n=>`<button data-need="${n[0]}" class="${state.selected.includes(n[0])?'selected':''}" aria-pressed="${state.selected.includes(n[0])}">${state.selected.includes(n[0])?state.selected.indexOf(n[0])+1+'. ':''}${esc(n[1])}</button>`).join('')}</div><div class="task">Write one sentence: <strong>“Without my first priority, …”</strong></div><p class="small">Compare with a partner. How could different priorities create conflict?</p>`;
 if(s.type==='idea')return `${heading(s)}<div class="two"><div><p class="eyebrow">Physical</p><p class="big">Keeping your<br>body alive</p><p style="margin-top:25px">Food. Shelter. Protection.</p><p class="small" style="margin-top:20px">Hunting supplies meat, but becomes a route to power and violence.</p></div><div class="divider"><p class="eyebrow">Moral</p><p class="big">Keeping your<br>humanity alive</p><p style="margin-top:25px">Rules. Care. Responsibility.</p><p class="small" style="margin-top:20px">Ralph’s signal fire depends on cooperation and thinking beyond the present.</p></div></div><div class="task">Does becoming a better hunter make the island safer?</div>`;
 if(s.type==='context')return `${heading(s)}<div class="two"><div><p class="eyebrow">The Second World War</p><p class="big">Civilisation does not guarantee goodness.</p><p style="margin-top:22px">Golding’s Royal Navy service shaped his concern with human cruelty.</p></div><div class="divider"><p class="eyebrow">The Coral Island · 1858</p><p class="big">An island adventure, reconsidered.</p><p style="margin-top:22px">Golding challenges Ballantyne’s confident picture of British boys surviving nobly.</p></div></div><p class="task">The ending: a naval officer saves the boys, yet his warship belongs to an adult world at war.</p>`;
 if(s.type==='activity')return `${heading(s)}<p class="big">How does each quotation explore survival?</p><ol><li>Choose <strong>physical</strong>, <strong>moral</strong> or <strong>both</strong>.</li><li>Zoom in on one word, image or technique.</li><li>Explain: <strong>“Golding uses this to suggest…”</strong></li></ol><p class="task">Different interpretations are welcome. Support yours with evidence.</p>`;
 if(s.type==='quote'){
 const q=QUOTES[s.quoteIndex],reveal=state.revealed[q.id];
 return `${heading(s)}<blockquote class="quote-text" style="margin:0">“${esc(q.text)}”</blockquote><p class="quote-meta">${esc(q.who)} · ${esc(q.chapter)}</p><div class="quote-tools"><p class="small">Which kind of survival? Choose and explain.</p><div class="actions">${[['physical','Physical'],['civilised','Moral'],['both','Both']].map(([id,label])=>`<button data-kind="${id}" class="${state.picks[q.id]===id?'selected':''}" aria-pressed="${state.picks[q.id]===id}">${label}</button>`).join('')}<button data-reveal="${q.id}" class="primary">${reveal?'Hide analysis':'Reveal analysis'}</button></div>${reveal?`<p class="answer"><strong>One reading:</strong> ${esc(q.note)}</p>`:''}</div>`;
 }
 if(s.type==='model')return `${heading(s)}<p class="subtitle">How does Golding present survival?</p><p class="model">${modelText}</p><div class="model-key"><span>01 Argument</span><span>02 Evidence</span><span>03 Word analysis</span><span>04 Wider meaning</span></div>`;
 if(s.type==='quiz'){
 const q=QUIZ[state.question],pick=state.answers[state.question],score=state.answers.reduce((n,a,i)=>n+(a===QUIZ[i].ans?1:0),0);
 return `${eyebrow(s)}<div class="actions" style="justify-content:space-between"><h2>Quick quiz</h2><span class="small">${score} / ${QUIZ.length} correct</span></div><div class="quiz-numbers">${QUIZ.map((_,i)=>`<button data-question="${i}" aria-label="Question ${i+1}" class="${i===state.question?'selected':''}">${i+1}</button>`).join('')}</div><p style="font-size:27px">${esc(q.q)}</p><div class="quiz-options">${q.opts.map((o,i)=>`<button data-answer="${i}" class="${pick!==null&&i===q.ans?'correct':pick===i?'wrong':''}" aria-pressed="${pick===i}"><b>${'ABCD'[i]}</b><span>${esc(o)}</span></button>`).join('')}</div>${pick!==null?`<p class="answer"><strong>${pick===q.ans?'Correct.':'Try this reading.'}</strong> ${esc(q.why)}</p>`:''}`;
 }
 if(s.type==='reading')return `${heading(s)}<div><div class="reading-item"><strong>Chapters 2, 4 &amp; 5</strong><span>The first fire, missed rescue and Simon’s insight.</span></div><div class="reading-item"><strong>Chapters 11 &amp; 12</strong><span>Piggy’s death, the final hunt and ironic rescue.</span></div><div class="reading-item"><strong><em>The Coral Island</em></strong><span>R. M. Ballantyne · Compare its island adventure with Golding’s.</span></div><div class="reading-item"><strong>“Fable”</strong><span>William Golding · His account of the novel and human nature.</span></div></div><p class="small">Connect Survival to the Beast, Leadership and Violence.</p>`;
 return `${eyebrow(s)}<div class="rule"></div><h2>If they stay alive but lose their humanity, have they survived?</h2><p class="subtitle">Discuss using one quotation from today.</p><p class="small">Thank you · Ayman &amp; Milo</p>`;
}
function resize(){const stage=document.getElementById('stage'),mobile=window.innerWidth<=800;const w=mobile?680:1280,h=mobile?900:720;slideEl.classList.toggle('mobile',mobile);const margin=state.presenting?0:window.innerWidth<=800?24:48;const scale=Math.max(.1,Math.min((stage.clientWidth-margin)/w,(stage.clientHeight-margin)/h));slideEl.style.transform=`scale(${scale})`;document.getElementById('canvasWrap').style.cssText=`width:${w*scale}px;height:${h*scale}px`}
function render(){
 const s=slides[state.index];slideEl.className=`slide ${s.type==='cover'?'cover':''} ${s.type==='closing'?'closing':''}`;slideEl.innerHTML=content(s)+footer();slideEl.setAttribute('aria-label',`Slide ${state.index+1}: ${s.title}`);
 strip.innerHTML=slides.map((item,i)=>`<button class="thumb" data-go="${i}" aria-label="Slide ${i+1}: ${esc(item.title)}" aria-current="${i===state.index}"><span class="thumb-number">${i+1}</span><span class="thumb-frame ${item.type==='cover'?'thumb-title':''}"><span class="thumb-label" style="display:block"><small>${esc(item.section)}</small>${esc(item.title)}</span><span class="thumb-rule" style="display:block"></span><span class="thumb-lines" style="display:block"></span></span></button>`).join('');
 document.getElementById('slideStatus').textContent=`${state.index+1} / ${slides.length}`;document.getElementById('sectionName').textContent=s.section;document.getElementById('previous').disabled=state.index===0;document.getElementById('next').disabled=state.index===slides.length-1;document.getElementById('progress').style.width=`${(state.index+1)/slides.length*100}%`;
 document.getElementById('notes').hidden=!state.notes||state.presenting;document.getElementById('notesToggle').setAttribute('aria-pressed',state.notes);document.getElementById('notesToggle').classList.toggle('active',state.notes);document.getElementById('noteTime').textContent=' · '+s.time;document.getElementById('noteText').textContent=s[state.speaker];document.getElementById('aymanTab').classList.toggle('active',state.speaker==='ayman');document.getElementById('miloTab').classList.toggle('active',state.speaker==='milo');resize();
}
function go(n){state.index=Math.max(0,Math.min(slides.length-1,n));history.replaceState(null,'',`#slide=${state.index+1}`);render();const thumb=strip.querySelector('[aria-current=true]');if(thumb)thumb.scrollIntoView({block:'nearest',inline:'nearest'});}
async function present(){state.presenting=true;document.body.classList.add('presenting');render();try{if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen()}catch{}resize()}
async function exit(){state.presenting=false;document.body.classList.remove('presenting');if(document.fullscreenElement)try{await document.exitFullscreen()}catch{}render()}
document.getElementById('presentBtn').onclick=present;document.getElementById('exitPresent').onclick=exit;document.getElementById('previous').onclick=()=>go(state.index-1);document.getElementById('next').onclick=()=>go(state.index+1);document.getElementById('notesToggle').onclick=()=>{state.notes=!state.notes;render()};document.getElementById('aymanTab').onclick=()=>{state.speaker='ayman';render()};document.getElementById('miloTab').onclick=()=>{state.speaker='milo';render()};document.getElementById('printBtn').onclick=()=>window.print();
document.getElementById('copyBtn').onclick=async()=>{try{await navigator.clipboard.writeText(location.href.split('#')[0]+`#slide=${state.index+1}`);toast('Slide link copied')}catch{toast('Copy the address from your browser to share this slide')}};
function toast(message){document.querySelector('.toast')?.remove();const el=document.createElement('div');el.className='toast';el.setAttribute('role','status');el.textContent=message;document.body.append(el);setTimeout(()=>el.remove(),2800)}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.hasAttribute('data-go'))return go(Number(b.dataset.go));if(b.dataset.need){const id=b.dataset.need;if(state.selected.includes(id))state.selected=state.selected.filter(x=>x!==id);else if(state.selected.length<3)state.selected.push(id);else toast('Choose up to three priorities. Tap one again to remove it.');render()}if(b.dataset.kind){state.picks[QUOTES[slides[state.index].quoteIndex].id]=b.dataset.kind;render()}if(b.dataset.reveal){state.revealed[b.dataset.reveal]=!state.revealed[b.dataset.reveal];render()}if(b.hasAttribute('data-question')){state.question=Number(b.dataset.question);render()}if(b.hasAttribute('data-answer')){state.answers[state.question]=Number(b.dataset.answer);render()}});
document.addEventListener('keydown',e=>{if(e.altKey||e.ctrlKey||e.metaKey||e.repeat||e.target.closest('input,textarea,select,[contenteditable=true]'))return;if(e.key==='Escape'){if(state.presenting){e.preventDefault();exit()}return}if(['ArrowRight','PageDown'].includes(e.key)||(e.key===' '&&state.presenting)){e.preventDefault();go(state.index+1)}else if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(state.index-1)}else if(e.key==='Home'){e.preventDefault();go(0)}else if(e.key==='End'){e.preventDefault();go(slides.length-1)}else if(e.key.toLowerCase()==='f'){e.preventDefault();state.presenting?exit():present()}else if(e.key.toLowerCase()==='n'&&!state.presenting){state.notes=!state.notes;render()}else if(slides[state.index].type==='quiz'&&'abcd'.includes(e.key.toLowerCase())&&e.key.length===1){state.answers[state.question]='abcd'.indexOf(e.key.toLowerCase());render()}});
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement&&state.presenting){state.presenting=false;document.body.classList.remove('presenting');render()}});window.addEventListener('resize',resize);window.addEventListener('hashchange',()=>{const m=location.hash.match(/^#slide=(\d+)$/);if(m)go(Number(m[1])-1)});
document.getElementById('printSheet').innerHTML=`<h1>Survival in Lord of the Flies</h1><p>Ayman &amp; Milo · Revision handout</p><h2>Do now</h2><p>Choose three priorities: signal fire, rules, leadership, shelter and food. Explain your first choice.</p><h2>The central idea</h2><p>Physical survival means staying alive. Moral survival means retaining empathy, responsibility and self-control. Golding explores the tension between these needs.</p><h2>Five key quotations</h2><table><thead><tr><th>Quotation</th><th>Analysis</th></tr></thead><tbody>${QUOTES.map(q=>`<tr><td>“${esc(q.text)}”<br>${esc(q.who)} · ${esc(q.chapter)}</td><td>${esc(q.note)}</td></tr>`).join('')}</tbody></table><h2>Model paragraph</h2><p>${modelText}</p><h2>Further reading</h2><p>Chapters 2, 4, 5, 11 and 12; R. M. Ballantyne’s The Coral Island; William Golding’s essay “Fable”.</p>`;
render();

</script></body></html>
